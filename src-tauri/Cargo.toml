[package]
name = "cubic_launcher"
version = "0.1.2"
description = "Cubic Launcher desktop application"
authors = ["Cubic Launcher"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cubic_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
# Without a backend feature `keyring` silently falls back to its in-memory
# mock store, which forgets the token key between two `Entry` values: every
# saved account became undecryptable and every launch fell back to offline
# (F1). One real store per shipped platform: Secret Service on Linux, the
# Keychain on macOS, the Credential Manager on Windows.
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
libc = "0.2"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# System trash for the screenshot deletion (D64): the hand-rolled freedesktop
# implementation only covered Linux, and Windows is a shipped target.
trash = "5"
uuid = { version = "1", features = ["v5"] }
zip = "0.6"
flate2 = "1"
# The world list (E10) reads three fields out of `level.dat`, which is gzipped
# NBT. `flate2` above handles the gzip; this handles the NBT.
fastnbt = "2"
tar = "0.4"

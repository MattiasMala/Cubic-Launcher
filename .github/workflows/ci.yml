name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libdbus-1-dev: libdbus-sys links against it, for keyring's Secret Service
          # backend, which keeps the key of the account tokens (F1). Direct build
          # requirement: without it the Rust build fails, whatever webkit pulls in.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests

  build:
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: libdbus-sys links against it, for keyring's Secret Service
          # backend, which keeps the key of the account tokens (F1). Direct build
          # requirement: without it the Rust build fails, whatever webkit pulls in.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      # Updater artifacts require signing keys, which CI intentionally does not use.
      - name: Disable updater artifacts in CI
        shell: bash
        run: printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > ci-override.json

      - name: Build application bundles
        run: npm run tauri build -- --config ci-override.json

      - uses: actions/upload-artifact@v4
        with:
          name: cubic-launcher-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          retention-days: 14

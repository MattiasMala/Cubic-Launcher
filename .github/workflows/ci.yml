name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Il numero di versione vive in due posti: rust-toolchain.toml e i ref
      # dell'action in tre workflow. Il file vince sul `rustup default` che
      # l'action imposta, quindi un ref rimasto indietro non cambia la toolchain
      # che si usa: la CI resta corretta e si scarica una seconda toolchain in
      # silenzio. Per lo stesso motivo questo passo non può chiedere a `rustc`
      # quale versione è attiva — `rustc` risponderebbe leggendo il file, cioè
      # confrontando il file con se stesso (D136, corretto dopo CUB-12).
      #
      # Il pattern è ancorato a inizio riga perché questo file è uno dei file
      # che `grep -r` legge: senza l'ancora trova se stesso e il passo fallisce
      # a ogni run. La lineetta è opzionale perché launch-harness.yml scrive
      # `uses:` sotto un `- name:`. Non togliere né l'ancora né il `-?`.
      - name: Toolchain pin matches the action refs
        run: |
          pinned=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          refs=$(grep -rhoP '^\s*-?\s*uses:\s*dtolnay/rust-toolchain@\K\S+' .github/workflows/ | sort -u)
          echo "pinned=$pinned"
          echo "refs=$refs"
          test "$refs" = "$pinned"

      # La guardia offline (scripts/launch-harness/offline_guard.py) vede le
      # richieste del launcher perché `reqwest` legge HTTP(S)_PROXY e ALL_PROXY
      # dall'ambiente. Un client che imposta un proxy suo, o lo spegne, rende la
      # guardia cieca su quel client senza farla diventare rossa: questo passo
      # fallisce prima (onda 8a). Cerca solo in src-tauri/src/, quindi non trova
      # se stesso.
      - name: No launcher HTTP client sets its own proxy
        run: |
          if grep -rnE '\.proxy\(|no_proxy' src-tauri/src/; then
            echo "a client in src-tauri/src/ sets or disables its own proxy: the offline guard cannot see it"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # rustfmt e clippy nominati esplicitamente: l'action installa con
      # `--profile minimal`, che non garantisce né l'uno né l'altro.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libdbus-1-dev: libdbus-sys links against it, for keyring's Secret Service
          # backend, which keeps the key of the account tokens (F1). Direct build
          # requirement: without it the Rust build fails, whatever webkit pulls in.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      # Some Rust tests read the real client.jar of 1.20.1 and 26.3 from the
      # launcher cache (src-tauri/src/test_client_jars.rs). A runner has no such
      # cache: without these two steps those tests would skip and pass empty.
      # The key hashes the script, which holds the version list.
      - name: Cache client jars
        id: client-jars
        uses: actions/cache@v4
        with:
          path: ~/.local/share/com.cubic.launcher/cache/minecraft
          key: client-jars-${{ hashFiles('scripts/ci/fetch_client_jars.py') }}

      - name: Fetch client jars
        if: steps.client-jars.outputs.cache-hit != 'true'
        run: python3 scripts/ci/fetch_client_jars.py

      - name: Test Rust
        env:
          # A missing jar fails the test instead of skipping it.
          CUBIC_REQUIRE_CLIENT_JARS: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: libdbus-sys links against it, for keyring's Secret Service
          # backend, which keeps the key of the account tokens (F1). Direct build
          # requirement: without it the Rust build fails, whatever webkit pulls in.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      # Updater artifacts require signing keys, which CI intentionally does not use.
      - name: Disable updater artifacts in CI
        shell: bash
        run: printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > ci-override.json

      - name: Build application bundles
        run: npm run tauri build -- --config ci-override.json

      - uses: actions/upload-artifact@v4
        with:
          name: cubic-launcher-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          retention-days: 14
